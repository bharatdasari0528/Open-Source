<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title><link rel="stylesheet" th:href="@{/css/style.css}"><script defer th:src="@{/js/validation.js}"></script></head><body><main class="panel"><h1>Reset password</h1><p class="error" th:if="${error}" th:text="${error}"></p><p class="success" th:if="${success}" th:text="${success}"></p><form th:action="@{/reset}" th:object="${form}" method="post" data-password-match><input type="hidden" name="token" th:value="${token}"><label>New password</label><input th:field="*{password}" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><p class="error" th:errors="*{password}"></p><label>Confirm new password</label><input th:field="*{confirmPassword}" type="password" autocomplete="new-password" required><p class="error" th:errors="*{confirmPassword}"></p><button>Update password</button></form></main></body></html>
