<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password</title><link rel="stylesheet" th:href="@{/css/style.css}"><script defer th:src="@{/js/validation.js}"></script></head><body><main class="panel"><h1>Forgot password</h1><p class="error" th:if="${error}" th:text="${error}"></p><p class="success" th:if="${success}" th:text="${success}"></p><p>Enter your email address. If an account exists, we'll send a reset link.</p><form th:action="@{/forgot}" method="post"><label>Email</label><input name="email" type="email" required><button>Send reset link</button></form><p><a th:href="@{/login}">Back to sign in</a></p></main></body></html>
