<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in</title><link rel="stylesheet" th:href="@{/css/style.css}"><script defer th:src="@{/js/validation.js}"></script></head><body><main class="panel"><h1>Sign in</h1><p class="error" th:if="${error}" th:text="${error}"></p><p class="success" th:if="${success}" th:text="${success}"></p><p class="error" th:if="${param.error}">Invalid email or password.</p><p class="success" th:if="${param.logout}">You have logged out.</p><form th:action="@{/login}" method="post"><label>Email</label><input name="email" type="email" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button>Sign in</button></form><div class="links"><a th:href="@{/register}">Create account</a><a th:href="@{/forgot}">Forgot password?</a></div></main></body></html>
