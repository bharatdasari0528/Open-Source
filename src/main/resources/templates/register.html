<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account</title><link rel="stylesheet" th:href="@{/css/style.css}"><script defer th:src="@{/js/validation.js}"></script></head><body><main class="panel"><h1>Create account</h1><p class="error" th:if="${error}" th:text="${error}"></p><p class="success" th:if="${success}" th:text="${success}"></p><form th:action="@{/register}" th:object="${form}" method="post" data-password-match><label>Full name</label><input th:field="*{name}" minlength="2" maxlength="80" required><p class="error" th:errors="*{name}"></p><label>Email</label><input th:field="*{email}" type="email" required><p class="error" th:errors="*{email}"></p><label>Password</label><input th:field="*{password}" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><p class="error" th:errors="*{password}"></p><p class="hint">Use at least 8 characters.</p><label>Confirm password</label><input th:field="*{confirmPassword}" type="password" autocomplete="new-password" required><p class="error" th:errors="*{confirmPassword}"></p><button>Register</button></form><p><a th:href="@{/login}">Already have an account?</a></p></main></body></html>
