<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" th:href="@{/css/style.css}"><script defer th:src="@{/js/validation.js}"></script></head><body><main class="panel"><h1>Dashboard</h1><p class="error" th:if="${error}" th:text="${error}"></p><p class="success" th:if="${success}" th:text="${success}"></p><p>Welcome! You are signed in as <strong th:text="${email}"></strong>.</p><form th:action="@{/logout}" method="post"><button>Log out</button></form></main></body></html>
