spring.application.name=auth-system
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_system?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@example.test}
app.base-url=${APP_BASE_URL:http://localhost:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
